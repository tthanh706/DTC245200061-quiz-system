<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Đăng nhập - Quiz System</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body class="login-page">
    <div class="login-container">
      <div class="login-card">
        <h1>HỆ THỐNG THI TRẮC NGHIỆM</h1>

        <p class="login-subtitle">Đăng nhập để tiếp tục</p>

        <div id="error-message" class="error-message"></div>

        <div class="form-group">
          <label> Tên đăng nhập </label>

          <input type="text" id="username" placeholder="Nhập tên đăng nhập" />
        </div>

        <div class="form-group">
          <label> Mật khẩu </label>

          <input type="password" id="password" placeholder="Nhập mật khẩu" />
        </div>

        <button class="login-button" onclick="login()">Đăng nhập</button>

        <div class="demo-account">
          <p>Tài khoản demo</p>

          <small> Admin: admin / Admin@123 </small>

          <br />

          <small> Sinh viên: student01 / Student@123 </small>
        </div>
      </div>
    </div>

    <script>
      async function login() {
        const username = document.getElementById("username").value.trim();

        const password = document.getElementById("password").value;

        const errorBox = document.getElementById("error-message");

        errorBox.textContent = "";

        if (!username || !password) {
          errorBox.textContent = "Vui lòng nhập đầy đủ tài khoản và mật khẩu.";

          return;
        }

        try {
          const response = await fetch("/api/auth/login", {
            method: "POST",

            headers: {
              "Content-Type": "application/json",
            },

            body: JSON.stringify({
              username,
              password,
            }),
          });

          const data = await response.json();

          if (!response.ok) {
            errorBox.textContent = data.error || "Đăng nhập thất bại.";

            return;
          }

          localStorage.setItem("quiz_user", JSON.stringify(data.user));

          if (data.user.role === "admin") {
            window.location.href = "/admin-dashboard.html";
          } else {
            window.location.href = "/student-dashboard.html";
          }
        } catch (error) {
          errorBox.textContent = "Không thể kết nối đến máy chủ.";
        }
      }

      // Cho phép nhấn Enter để đăng nhập

      document.addEventListener("keydown", function (event) {
        if (event.key === "Enter") {
          login();
        }
      });
    </script>
  </body>
</html>
