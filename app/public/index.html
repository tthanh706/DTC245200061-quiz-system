<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hệ thống thi trắc nghiệm</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header class="header">
      <h1>HỆ THỐNG THI TRẮC NGHIỆM</h1>
      <p>Quiz Online</p>
    </header>

    <main class="container">
      <section class="card">
        <h2>Danh sách bài thi</h2>

        <div id="quiz-list">Đang tải dữ liệu...</div>
      </section>

      <div class="actions">
        <a href="/results.html" class="secondary-button"> Xem kết quả thi </a>
      </div>
    </main>

    <script>
      async function loadQuizzes() {
        try {
          const response = await fetch("/api/quizzes");
          const quizzes = await response.json();

          const container = document.getElementById("quiz-list");
          container.innerHTML = "";

          quizzes.forEach((quiz) => {
            const div = document.createElement("div");
            div.className = "quiz-item";

            div.innerHTML = `
            <h3>${quiz.title}</h3>
            <p>${quiz.description || ""}</p>

            <button onclick="startQuiz(${quiz.id})">
              Bắt đầu làm bài
            </button>
          `;

            container.appendChild(div);
          });
        } catch (error) {
          document.getElementById("quiz-list").innerHTML =
            "Không tải được dữ liệu.";
        }
      }

      function startQuiz(id) {
        window.location.href = "/quiz.html?id=" + id;
      }

      loadQuizzes();
    </script>
  </body>
</html>
