<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Làm bài thi</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header class="header">
      <h1>LÀM BÀI THI</h1>
    </header>

    <main class="container">
      <div class="card">
        <div class="form-group">
          <label>Họ và tên</label>

          <input id="studentName" placeholder="Nhập họ và tên" />
        </div>

        <div id="questions">Đang tải câu hỏi...</div>

        <button class="submit-button" onclick="submitQuiz()">Nộp bài</button>

        <div id="result"></div>

        <br />

        <a href="/" class="secondary-button"> Quay lại trang chủ </a>
      </div>
    </main>

    <script>
      const params = new URLSearchParams(window.location.search);
      const quizId = params.get("id");

      let questions = [];

      async function loadQuiz() {
        try {
          const response = await fetch(`/api/quizzes/${quizId}/questions`);

          questions = await response.json();

          const container = document.getElementById("questions");

          container.innerHTML = "";

          questions.forEach((question, index) => {
            const div = document.createElement("div");
            div.className = "question";

            let html = `
            <h3>
              Câu ${index + 1}: ${question.question_text}
            </h3>
          `;

            question.answers.forEach((answer) => {
              html += `
              <label class="answer">
                <input
                  type="radio"
                  name="question_${question.id}"
                  value="${answer.id}"
                >
                ${answer.answer_text}
              </label>
            `;
            });

            div.innerHTML = html;
            container.appendChild(div);
          });
        } catch (error) {
          document.getElementById("questions").innerHTML =
            "Không tải được câu hỏi.";
        }
      }

      async function submitQuiz() {
        const studentName = document.getElementById("studentName").value.trim();

        if (!studentName) {
          alert("Vui lòng nhập họ và tên.");
          return;
        }

        const answers = {};

        questions.forEach((question) => {
          const selected = document.querySelector(
            `input[name="question_${question.id}"]:checked`,
          );

          if (selected) {
            answers[question.id] = selected.value;
          }
        });

        const response = await fetch("/api/submit", {
          method: "POST",

          headers: {
            "Content-Type": "application/json",
          },

          body: JSON.stringify({
            studentName,
            quizId,
            answers,
          }),
        });

        const result = await response.json();

        if (!response.ok) {
          alert(result.error || "Có lỗi xảy ra");
          return;
        }

        document.getElementById("result").innerHTML = `
        <div class="result-box">
          <h2>KẾT QUẢ</h2>

          <p>
            Sinh viên:
            <strong>${result.studentName}</strong>
          </p>

          <p>
            Số câu đúng:
            ${result.correct}/${result.total}
          </p>

          <h2>
            Điểm: ${result.score}/10
          </h2>
        </div>
      `;
      }

      loadQuiz();
    </script>
  </body>
</html>
